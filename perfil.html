<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="http://www.ciens.ucv.ve/portalasig2/favicon.ico" type="image/x-icon">
    <title>Perfil</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/index.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="foto">
            <img id="perfil-img-default" src="images/default_profile.png" alt="Foto de perfil">
        </div>

        <div class="info-perfil">
            <div class="nombre-perfil"><h1 id="perfil-nombre"></h1></div>

            <div class="descripcion-perfil">
                <p id="perfil-descripcion"></p>
            </div>

            <div class="gustos-perfil">
                <p>Mi color favorito es: <span id="perfil-color"></span></p>
                <p>Mi libro favorito es: <span id="perfil-libro"></span></p>
                <p>Estilo de música preferida es: <span id="perfil-musica"></span></p>
                <p>Mis Videojuegos favoritos son: <span id="perfil-videojuego"></span></p>
                <p><strong>Lenguajes aprendidos: <span id="perfil-lenguajes"></span></strong></p>
            </div>

            <div class="contacto-email">
                <p>Si necesitan comunicarse conmigo me pueden escribir a: <a id="perfil-email"></a></p>
            </div>
        </div>
    </div>    
</body>
</html>
